name: Build and Deploy Docker Image to Azure Function App - check-match

on:
  push:
    branches:
      - DI-bachnn-test
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE_NAME=ghcr.io/di-bachnn/dynam_check_match/dynam_function_app:latest
          docker build -t $IMAGE_NAME .

      - name: Push Docker image
        run: |
          IMAGE_NAME=ghcr.io/di-bachnn/dynam_check_match/dynam_function_app:latest
          docker push $IMAGE_NAME

      - name: Deploy Docker image to Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: 'check-match'
          slot-name: 'Production'
          images: 'ghcr.io/di-bachnn/dynam_check_match/dynam_function_app:latest'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_8C1241D74FCC445DBD63081033742609 }}
